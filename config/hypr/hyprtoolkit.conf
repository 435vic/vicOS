# Pond Daylight palette (adapted from vicOS config/quickshell/pond/themes/Daylight.qml)
background       = rgba(202020cc)
base             = rgba(323232e6)
alternate_base   = rgba(3b3b3be6)
text             = rgba(f8f9f9ff)
bright_text      = rgba(ffffffff)
accent           = rgba(cba6f7ff)
accent_secondary = rgba(d1c9ffff)

# Typography (Onest + IBM Plex Mono, slightly tightened from defaults)
font_family           = Onest
font_family_monospace = IBM Plex Mono
h1_size               = 16
h2_size               = 13
h3_size               = 12
font_size             = 11
small_font_size       = 10

# Geometry & Icons
rounding_large = 16
rounding_small = 0
icon_theme     = Papirus-Dark
